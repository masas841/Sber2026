<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=504, height=504, initial-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#21a038" />
  <title>Smile Pay — оплата улыбкой</title>
  <link rel="stylesheet" href="/static/css/fonts.css?v=20260612-qr-sticker-fill-2" />
  <link rel="stylesheet" href="/static/css/style.css?v=20260619-boomerang" />
  <link rel="stylesheet" href="/static/css/kiosk-install-standby.css?v=20260619-figma" />
</head>
<body>
  <div id="kiosk-install-standby" class="kiosk-install-standby hidden" hidden aria-live="polite">
    <div class="kiosk-install-standby__canvas" role="status">
      <div class="kiosk-install-standby__pill" aria-hidden="true"></div>
      <div class="kiosk-install-standby__copy">
        <h1 class="kiosk-install-standby__title">До встречи!</h1>
        <p class="kiosk-install-standby__text">Спасибо что провели этот день вместе со Сбер!</p>
      </div>
      <img class="kiosk-install-standby__decor kiosk-install-standby__decor--flower" src="/static/assets/figma/install-off/flower-sber.svg" alt="" aria-hidden="true" />
      <img class="kiosk-install-standby__decor kiosk-install-standby__decor--smile" src="/static/assets/figma/install-off/smile-pink.svg" alt="" aria-hidden="true" />
      <img class="kiosk-install-standby__decor kiosk-install-standby__decor--squiggle" src="/static/assets/figma/install-off/squiggle-blue.svg" alt="" aria-hidden="true" />
      <img class="kiosk-install-standby__decor kiosk-install-standby__decor--star-pink" src="/static/assets/figma/install-off/star-pink.svg" alt="" aria-hidden="true" />
      <img class="kiosk-install-standby__decor kiosk-install-standby__decor--star-blue" src="/static/assets/figma/install-off/star-blue.svg" alt="" aria-hidden="true" />
    </div>
  </div>
  <main class="shell" id="shell" data-kiosk-main>
    <div id="camera-slot" class="camera-slot">
      <div class="camera-slot__view">
        <div class="camera-slot__placeholder" aria-hidden="true"></div>
        <video id="preview" autoplay playsinline muted></video>
        <canvas id="boomerang" class="camera-slot__boomerang" hidden aria-hidden="true"></canvas>
      </div>
    </div>
    <div id="stage-root" class="stage-root" aria-live="polite"></div>
    <p id="smile-status" class="smile-status" hidden></p>
  </main>
  <canvas id="snapshot" class="visually-hidden" aria-hidden="true"></canvas>
  <script type="module" src="/static/js/app.js?v=20260619-boomerang"></script>
</body>
</html>
