<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Пульт: Застрахуй свой чилл</title>
  <link rel="stylesheet" href="/static/css/control.css?v=rating-stars-1" />
</head>
<body>
  <main id="control" class="control" data-phase="idle">
    <p id="connection" class="connection">подключение...</p>

    <section class="control-screen control-screen--start" data-screen="idle" aria-label="Старт">
      <div class="scene-bg" aria-hidden="true">
        <img class="blob blob--a" src="/static/assets/figma/control/raw/63ed6a4ccea3f66b2fb6e7da8ee2acf338557a82.svg" alt="" />
        <img class="blob blob--b" src="/static/assets/figma/control/raw/63ed6a4ccea3f66b2fb6e7da8ee2acf338557a82.svg" alt="" />
        <img class="fur fur--left" src="/static/assets/figma/control/raw/00b04727579141737620deeacb25fa19e92ae1f5.png" alt="" />
        <img class="fur fur--right" src="/static/assets/figma/control/raw/180918f8da7d62fb8a78a79158770294078c06fe.png" alt="" />
      </div>
      <img class="logo logo--start" src="/static/assets/figma/control/raw/2da3f8923a053f8811a635148d5f6eb019cc4afe.svg" alt="СберСтрахование" />
      <h1 class="start-title">защити<br />свой вайб</h1>
      <img class="ribbon ribbon--start" src="/static/assets/figma/control/raw/66ef35a5d32b6ae24598794ab7562171a475908e.svg" alt="" />

      <div class="threat threat--paw">
        <img src="/static/assets/figma/control/raw/758b324c82f48052d9537c8f4058eacfe56327c7.png" alt="" />
        <span class="label label--blue label--paw-a">кошачья лапа</span>
        <span class="label label--blue label--paw-b">толкает</span>
        <span class="label label--blue label--paw-c">телефон</span>
      </div>
      <div class="threat threat--fist">
        <img src="/static/assets/figma/control/raw/2c0e597ef34e1e25f22bece7f07f9071453c26c7.png" alt="" />
        <span class="label label--green label--fist-a">прилетает</span>
        <span class="label label--green label--fist-b">кулак</span>
      </div>
      <div class="threat threat--drop">
        <img src="/static/assets/figma/control/raw/9f7d921244f8a87720fb41610a93ffa0de6d9559.png" alt="" />
        <span class="label label--pink label--drop-a">капли</span>
        <span class="label label--pink label--drop-b">воды</span>
      </div>
      <img class="star star--start-a" src="/static/assets/figma/control/raw/c292fdd83b98d20cb547090b8f9de688e6f81a81.svg" alt="" />
      <img class="star star--start-b" src="/static/assets/figma/control/raw/f6128198a813be92610df498e15742dd9f0f28ff.svg" alt="" />
      <button id="startButton" class="control-button control-button--start" type="button">старт</button>
    </section>

    <section class="control-screen control-screen--game" data-screen="playing" aria-label="Игра" hidden>
      <div id="aimSurface" class="aim-surface" role="button" tabindex="0" aria-label="Ведите пальцем для наведения, повторный тап в той же точке для хита">
        <div class="scene-bg" aria-hidden="true">
          <img class="blob blob--aim-left" src="/static/assets/figma/control/raw/63ed6a4ccea3f66b2fb6e7da8ee2acf338557a82.svg" alt="" />
          <img class="blob blob--aim-right" src="/static/assets/figma/control/raw/63ed6a4ccea3f66b2fb6e7da8ee2acf338557a82.svg" alt="" />
          <img class="blob blob--aim-bottom" src="/static/assets/figma/control/raw/cafd6de13e6d17c1a1231c05ef24640d2882b99c.svg" alt="" />
          <img class="fur fur--game-left" src="/static/assets/figma/control/raw/00b04727579141737620deeacb25fa19e92ae1f5.png" alt="" />
          <img class="fur fur--game-right" src="/static/assets/figma/control/raw/180918f8da7d62fb8a78a79158770294078c06fe.png" alt="" />
        </div>
        <div class="game-brand-panel" aria-hidden="true"></div>
        <img class="logo logo--game" src="/static/assets/figma/control/raw/7b14360a994d599902eb81b23613e97fc2d44b8b.svg" alt="СберСтрахование" />
        <h2 class="game-title">защити свой вайб</h2>
        <img class="ribbon ribbon--game" src="/static/assets/figma/control/raw/b18f33e9853ec47a872957ecaf2ca74df67b398b.svg" alt="" />
        <img class="star star--game-a" src="/static/assets/figma/control/raw/75030c4d25dc9f4bbf5edeb5fa78c37b0d43acfb.svg" alt="" />
        <img class="star star--game-b" src="/static/assets/figma/control/raw/e70745f3b1b77cd8d4560ba5b5b5abfb037f00f4.svg" alt="" />
        <svg class="rating-stars" viewBox="0 0 236 68" fill="none" aria-hidden="true">
          <path class="rating-stars__path" data-star="2" d="M198.188 5.81543C199.388 2.12315 204.612 2.12316 205.812 5.81543L210.883 21.4229C210.93 21.5674 211.065 21.6649 211.217 21.665H227.628C231.51 21.6654 233.124 26.6331 229.983 28.915L216.707 38.5615C216.584 38.651 216.532 38.8093 216.579 38.9541L221.65 54.5615C222.85 58.2538 218.624 61.3238 215.483 59.042L202.207 49.3965C202.084 49.3069 201.916 49.3069 201.793 49.3965L188.517 59.042C185.376 61.3238 181.15 58.2538 182.35 54.5615L187.421 38.9541C187.468 38.8093 187.416 38.651 187.293 38.5615L174.017 28.915C170.876 26.6331 172.49 21.6654 176.372 21.665H192.783C192.935 21.6649 193.07 21.5674 193.117 21.4229L198.188 5.81543Z" fill="url(#control-rating-star-right)" stroke="white" stroke-width="3.65586" />
          <path class="rating-stars__path" data-star="1" d="M114.188 5.81543C115.388 2.12315 120.612 2.12316 121.812 5.81543L126.883 21.4229C126.93 21.5674 127.065 21.6649 127.217 21.665H143.628C147.51 21.6654 149.124 26.6331 145.983 28.915L132.707 38.5615C132.584 38.651 132.532 38.8093 132.579 38.9541L137.65 54.5615C138.85 58.2538 134.624 61.3238 131.483 59.042L118.207 49.3965C118.084 49.3069 117.916 49.3069 117.793 49.3965L104.517 59.042C101.376 61.3238 97.1499 58.2538 98.3496 54.5615L103.421 38.9541C103.468 38.8093 103.416 38.651 103.293 38.5615L90.0166 28.915C86.8763 26.6331 88.4902 21.6654 92.3721 21.665H108.783C108.935 21.6649 109.07 21.5674 109.117 21.4229L114.188 5.81543Z" fill="url(#control-rating-star-middle)" stroke="white" stroke-width="3.65586" />
          <path class="rating-stars__path" data-star="0" d="M30.1885 5.81543C31.3882 2.12315 36.6118 2.12316 37.8115 5.81543L42.8828 21.4229C42.93 21.5674 43.0647 21.6649 43.2168 21.665H59.6279C63.5098 21.6654 65.1237 26.6331 61.9834 28.915L48.707 38.5615C48.5839 38.651 48.5322 38.8093 48.5791 38.9541L53.6504 54.5615C54.8501 58.2538 50.6242 61.3238 47.4834 59.042L34.207 49.3965C34.0837 49.3069 33.9163 49.3069 33.793 49.3965L20.5166 59.042C17.3758 61.3238 13.1499 58.2538 14.3496 54.5615L19.4209 38.9541C19.4678 38.8093 19.4161 38.651 19.293 38.5615L6.0166 28.915C2.87633 26.6331 4.49024 21.6654 8.37207 21.665H24.7832C24.9353 21.6649 25.07 21.5674 25.1172 21.4229L30.1885 5.81543Z" fill="url(#control-rating-star-left)" stroke="white" stroke-width="3.65586" />
          <defs>
            <linearGradient id="control-rating-star-right" x1="202" y1="0" x2="202" y2="68" gradientUnits="userSpaceOnUse">
              <stop stop-color="#57FF43" />
              <stop offset="1" stop-color="#00ADEE" />
            </linearGradient>
            <linearGradient id="control-rating-star-middle" x1="118" y1="0" x2="118" y2="68" gradientUnits="userSpaceOnUse">
              <stop stop-color="#57FF43" />
              <stop offset="1" stop-color="#00ADEE" />
            </linearGradient>
            <linearGradient id="control-rating-star-left" x1="34" y1="0" x2="34" y2="68" gradientUnits="userSpaceOnUse">
              <stop stop-color="#57FF43" />
              <stop offset="1" stop-color="#00ADEE" />
            </linearGradient>
          </defs>
        </svg>
        <div class="stats" aria-live="polite">
          <div class="stat-card">
            <span>ваш счёт:</span>
            <strong id="score">000</strong>
          </div>
          <div class="stat-card">
            <span>таймер:</span>
            <strong id="timer">59 с</strong>
          </div>
        </div>
        <img id="aimCursor" class="aim-cursor" src="/static/assets/figma/control/raw/control-aim-cursor.svg" alt="" aria-hidden="true" />
      </div>
    </section>

    <section class="control-screen control-screen--result" data-screen="result" aria-label="После игры" hidden>
      <div class="scene-bg" aria-hidden="true">
        <img class="blob blob--a" src="/static/assets/figma/control/raw/63ed6a4ccea3f66b2fb6e7da8ee2acf338557a82.svg" alt="" />
        <img class="blob blob--b" src="/static/assets/figma/control/raw/63ed6a4ccea3f66b2fb6e7da8ee2acf338557a82.svg" alt="" />
        <img class="fur fur--result-left" src="/static/assets/figma/control/raw/00b04727579141737620deeacb25fa19e92ae1f5.png" alt="" />
        <img class="fur fur--result-right" src="/static/assets/figma/control/raw/180918f8da7d62fb8a78a79158770294078c06fe.png" alt="" />
      </div>
      <img class="logo logo--result" src="/static/assets/figma/control/raw/f8bdcbf65236835dcff5c84d001f71f941f7cdf4.svg" alt="СберСтрахование" />
      <h2 class="result-title">твой вайб<br />застрахован</h2>
      <p class="result-copy">До начала следующего<br />раунда <span id="resultCountdown">22</span>...</p>
      <img class="ribbon ribbon--result" src="/static/assets/figma/control/raw/66ef35a5d32b6ae24598794ab7562171a475908e.svg" alt="" />
      <img class="result-threat result-threat--soap" src="/static/assets/figma/control/raw/50dd6d488abd268621b18460892b1285006a37a8.png" alt="" />
      <img class="result-threat result-threat--drop" src="/static/assets/figma/control/raw/9f7d921244f8a87720fb41610a93ffa0de6d9559.png" alt="" />
      <img class="result-threat result-threat--hammer" src="/static/assets/figma/control/raw/dc3cb622f1e47b456839d5b24ff0448b31ef17b5.png" alt="" />
      <div class="insured-stamp">застраховано</div>
    </section>

    <button id="resetButton" class="service-reset" type="button">сброс</button>
  </main>

  <script type="module" src="/static/js/control.js?v=hit-offset-1"></script>
</body>
</html>
